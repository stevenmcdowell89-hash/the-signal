name: Notify subscribers on new issue

# Fires on any push to main that adds a new file under /issues/. Works for
# both scheduled (Sunday trigger) and manual publishes — anything that lands
# a new issue HTML on main goes out as a push notification.
#
# Edits to existing issues do NOT notify (diff-filter=A only matches added
# files), so retroactive fixes don't ping the audience.

on:
  push:
    branches: [main]
    paths:
      - 'issues/*.html'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue path to notify for (e.g. issues/signal_deep-dive_2026-05-22.html). Leave blank to use the most recently added issue.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target issue
        id: find
        env:
          MANUAL_ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${MANUAL_ISSUE}" ]; then
              issue="${MANUAL_ISSUE}"
              echo "Manual run with explicit issue: ${issue}"
            else
              # Most recently added issue across history
              issue=$(git log --diff-filter=A --name-only --pretty=format: -- 'issues/*.html' | awk 'NF' | head -1)
              echo "Manual run, auto-detected latest issue: ${issue}"
            fi
          else
            issue=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'issues/*.html' | head -1)
            if [ -z "$issue" ]; then
              echo "No new issue added in this push (only edits). Skipping notify."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push-triggered, new issue: ${issue}"
          fi
          if [ -z "$issue" ] || [ ! -f "$issue" ]; then
            echo "::error::Could not resolve a valid issue path (got: '${issue}')"
            exit 1
          fi
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"

      - name: Send notification
        if: steps.find.outputs.skip != 'true'
        env:
          NOTIFY_AUTH_TOKEN: ${{ secrets.NOTIFY_AUTH_TOKEN }}
          SIGNAL_NOTIFY_HOST: ${{ secrets.SIGNAL_NOTIFY_HOST }}
          ISSUE: ${{ steps.find.outputs.issue }}
        run: |
          set -euo pipefail
          if [ -z "${NOTIFY_AUTH_TOKEN:-}" ] || [ -z "${SIGNAL_NOTIFY_HOST:-}" ]; then
            echo "::warning::NOTIFY_AUTH_TOKEN or SIGNAL_NOTIFY_HOST not set in repo secrets; skipping."
            exit 0
          fi
          python3 scripts/extract-issue-meta.py "$ISSUE" > payload.json
          echo "Payload:"; cat payload.json; echo
          curl -fsSL -X POST "https://${SIGNAL_NOTIFY_HOST}/api/notify" \
            -H "Authorization: Bearer ${NOTIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            | tee response.json
          echo
