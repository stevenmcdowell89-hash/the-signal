<!-- ══════ ROTATING WAX-STAMP SEAL (Enhancement 19C) ══════
  Fixed seal top-right of the viewport. The outer ring rotates; the
  inner numeral stays upright. Agent: update .numeral to the current
  section's roman numeral via scroll (see script.js), and set the
  issue-tag to "Nº [ISSUE_NUMBER_PADDED]" e.g. "Nº 003".
  Auto-hidden below 720px.
-->

  <div class="ring">
    <svg viewBox="0 0 120 120">
      <defs>
        <path id="stamp-curve" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/>
      </defs>
      <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.9"/>

        <textPath href="#stamp-curve" startOffset="0">THE · SIGNAL · SUNDAY · DISPATCH · THE · SIGNAL · SUNDAY · DISPATCH · </textPath>
      </text>
    </svg>
  </div>
  <div class="hub">
    <span>
      <span class="numeral" id="stampNumeral">I</span>
      <span class="issue-tag">Nº [NNN]</span>
    </span>
  </div>
</div>
