<!-- ══════ THE LONG SHELF ══════
  Enhancement 22 options: chapter-chrome at the top, marginalia sidebar
  (auto-inherits longshelf-accent), folio-watermark (bottom-right numeral).
  See assets/css/22-decorative.css for markup.
-->
<section class="sec longshelf-section">
  <span class="section-label" style="color:var(--rose)">The Long Shelf — Worth Your Time</span>
  <div class="longshelf-grid">
    <div class="shelf-item">
      <div class="title"><a href="[URL]">[Title]</a></div>
      <div class="meta">[Source] · [Author]</div>
      <div class="desc">[Why it's worth the reader's time]</div>
    </div>
    <!-- 6-8 items -->
  </div>
</section>
