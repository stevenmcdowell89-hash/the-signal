<!-- ══════ THIS WEEK IN HISTORY ══════
  Enhancement 22 options: chapter-chrome at top (hist-accent). Marginalia
  inherits history tint. Folio-watermark works well in hist-accent.
  See assets/css/22-decorative.css.
-->
<hr class="divider dv-history">
<section class="sec history-section sec-opener" id="history">
  <div class="sec-watermark">History</div>
  <span class="section-label" style="color:var(--hist-accent)">This Week in History</span>
  <h2>[Event title]</h2>
  <p>[150-300 words. Pre-WW2 preferred.]</p>
  <!-- Use .img-offset for asymmetric image + text wrap -->
  <div class="also"><div class="also-title">Also This Week in History</div>
    <div class="timeline">
      <div class="timeline-node reveal">
        <div class="timeline-date"><span class="year-badge">[YEAR]</span> [Date]</div>
        <div class="timeline-content"><strong>[Event]</strong> — [Description]</div>
      </div>
      <!-- 3-4 items -->
    </div>
  </div>
  <div class="read-next">Up next: <a href="#radar">On the Radar <span class="arrow">→</span></a> — [teaser]</div>
</section>
