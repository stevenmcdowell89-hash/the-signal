<!-- ══════ THE SHELF ══════
  Enhancement 22 options: chapter-chrome at top (shelf-accent). Marginalia
  auto-inverts to paper-on-dark here. See assets/css/22-decorative.css.
-->
<hr class="divider dv-shelf">
<section class="sec shelf-section" id="shelf">
  <div class="sec-watermark">Shelf</div>
  <span class="section-label">The Shelf</span>
  <h3>Books</h3>
  <h3 class="feature-title">[Book feature headline]</h3>
  <p>[Feature body]</p>
  <div class="book-grid">
    <div class="book-card reveal">
      <h4>[Book Title]</h4>
      <div class="author">[Author] · [Series]</div>
      <p>[Recommendation text]</p>
      <div class="rating" style="margin-top:8px"><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span><span class="dot"></span></div>
    </div>
    <!-- More book-cards -->
  </div>
  <h3>Music</h3><p>[When relevant]</p>
  <h3>Podcasts</h3><p>[Episode cross-refs]</p>
  <div class="also"><div class="also-title">Also on The Shelf</div>
    <ul class="also-list"><li><strong>[Item]</strong> — [Detail]</li></ul>
  </div>
  <div class="read-next">Up next: <a href="#session">The Session <span class="arrow">→</span></a> — [teaser]</div>
</section>
