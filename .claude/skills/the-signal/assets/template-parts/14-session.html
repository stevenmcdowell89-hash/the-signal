<!-- ══════ THE SESSION ══════
  Enhancement 22 options: chapter-chrome at top (session-accent). Marginalia
  inherits session tint. See assets/css/22-decorative.css.
-->
<hr class="divider dv-session">
<section class="sec session-section" id="session">
  <div class="sec-watermark">Session</div>
  <span class="section-label" style="color:var(--session-accent)">The Session</span>
  <h2>[Feature headline]</h2>
  <p>[Sourced feature article]</p>
  <!-- Display stat inline: <span class="display-stat" style="color:var(--session-accent)">[N]</span> -->
  <div class="workout-card reveal">
    <div class="workout-card-title">[Protocol Name]</div>
    <table>
      <tr><th>Scheme</th><th>Reps</th><th>Notes</th></tr>
      <tr><td>[Name]</td><td>[Reps]</td><td>[Description]</td></tr>
      <tr class="highlight-row"><td>[Name]</td><td>[Reps]</td><td>[Description]</td></tr>
    </table>
  </div>
  <div class="src"><a href="[URL]">[Source]</a></div>
  <div class="read-next">Up next: <a href="#history">This Week in History <span class="arrow">→</span></a> — [teaser]</div>
</section>
