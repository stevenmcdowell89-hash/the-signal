<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="currentColor" fill-opacity="0.32">
  <!-- matchday chequer tile (§2.3 example art): offset flag squares on currentColor.
       fill-opacity 0.32 baked into the art (WP-7 decision): at the event-skin
       ground opacity (0.26) the full-strength chequer measured ~heavier than any
       reference ground at 1440 and fought running text (flagged in the WP-6 e2e,
       confirmed in the WP-7 renders). Effective ink coverage is now ~0.08. -->
  <rect x="0" y="0" width="24" height="24"/>
  <rect x="48" y="0" width="24" height="24"/>
  <rect x="24" y="24" width="24" height="24"/>
  <rect x="72" y="24" width="24" height="24"/>
  <rect x="0" y="48" width="24" height="24"/>
  <rect x="48" y="48" width="24" height="24"/>
  <rect x="24" y="72" width="24" height="24"/>
  <rect x="72" y="72" width="24" height="24"/>
</svg>
