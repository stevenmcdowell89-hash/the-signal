<!doctype html><html><body>

     of domains can express. -->

     data-licence="PRESS-KIT-EDITORIAL" data-allows-derivatives="true">

     data-licence="CC-BY-4.0" data-allows-derivatives="true">

</div>
<div data-mx-event="figure" class="plate-img" data-shows="event_photo" data-capture-year="2026"
     data-licence="CC-BY-4.0" data-allows-derivatives="true">
  <img src="https://gallica.bnf.fr/iiif/ark:/12148/x/f1/full/full/0/native.jpg" alt="c" loading="lazy">
